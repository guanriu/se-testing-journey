name: Python API Automated Tests

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout code
      uses: actions/checkout@v3

    - name: 2. Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests allure-pytest

    - name: 4. Run tests
      run: |
        pytest Practice/data01_interface.py -v -s --alluredir=./allure-results || true

    - name: 5. 安装 Allure 命令行工具
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre
        wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        sudo tar -zxvf allure-2.24.0.tgz -C /opt/
        sudo ln -s /opt/allure-2.24.0/bin/allure /usr/bin/allure

    - name: 6. 生成 HTML 报告
      run: |
        allure generate ./allure-results -o ./allure-report --clean

    - name: 7. 部署到 GitHub Pages
      uses: actions/upload-pages-artifact@v2
      with:
        path: ./allure-report

    - name: 8. 发布网页
      id: deployment
      uses: actions/deploy-pages@v5