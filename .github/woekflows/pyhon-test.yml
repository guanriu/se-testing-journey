name: Python API Automated Tests

on:
  push:
    branches: [ "main" ]  # 只要你往 main 分支推送代码，就触发
  pull_request:
    branches: [ "main" ]  # 有人提 PR 也触发

jobs:
  test:
    runs-on: ubuntu-latest  # 用 GitHub 免费提供的一台最新版 Linux 虚拟机

    steps:
    - name: 1. 把你的代码拉取到虚拟机上
      uses: actions/checkout@v3

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # 指定版本

    - name: 3. 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests allure-pytest

    - name: 4. 运行测试并生成 Allure 数据
      run: |
        pytest test_user_business.py -v -s --alluredir=./allure-results
        
    # 注意：因为云端没有你本地的 Allure 环境，我们这里先只跑测试，
    # 报告数据会生成在云端，后面可以进阶搞网页托管。